<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="nameLightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d91b6e"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <clipPath id="bannerLightClip">
      <rect width="1280" height="740" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <style>
    @keyframes sweepDownLight {
      0% { transform: translateY(-740px); }
      100% { transform: translateY(740px); }
    }
    .scanner-line { animation: sweepDownLight 3.5s linear infinite; }
  </style>

  <g clip-path="url(#bannerLightClip)">
    <rect width="1280" height="740" fill="url(#bgLightGrad)"/>
    <rect width="1280" height="740" fill="none" stroke="#cbd5e1" stroke-width="2" rx="24"/>

    <g transform="translate(60, 50)">
      <rect width="450" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
      <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
      <circle cx="52" cy="17" r="4.5" fill="#10b981"/>
      <text x="70" y="22" font-family="monospace" font-size="13" fill="#0284c7">user@dev:~$ cat README.md</text>
    </g>

    <g transform="translate(60, 150)">
      <text font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#nameLightGrad)">
        Vishal Pratap Singh
      </text>
      <text y="38" font-family="monospace" font-size="18" fill="#475569">
        &gt; Student &amp; Software Developer
      </text>
    </g>

    <g transform="translate(60, 230)">
      <rect width="210" height="36" rx="18" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
      <text x="105" y="23" font-family="monospace" font-size="14" font-weight="bold" fill="#db2777" text-anchor="middle">
        ⚡ "On Code Mode"
      </text>
    </g>

    <g transform="translate(60, 305)">
      <rect width="520" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b">SKILLS:</text>
      <text x="20" y="58" font-family="sans-serif" font-size="13" fill="#1e293b">Python • Java • C++ • JavaScript • React • NodeJS • Docker • Angular</text>
    </g>

    <g transform="translate(60, 420)">
      <rect width="520" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="50" font-family="monospace" font-size="13" fill="#0284c7">const coder = new StudentDeveloper("Vishal");</text>
      <text x="20" y="85" font-family="monospace" font-size="13" fill="#16a34a">// Dedicated to continuous problem solving</text>
      <text x="20" y="120" font-family="monospace" font-size="13" fill="#475569">coder.solve("LeetCode &amp; CodeChef");</text>
      <text x="20" y="155" font-family="monospace" font-size="13" fill="#d91b6e">coder.deploy();</text>
    </g>

    <g transform="translate(680, 130)">
      <rect width="540" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <clipPath id="lightFrame">
        <rect width="540" height="540" rx="16"/>
      </clipPath>
      <g clip-path="url(#lightFrame)">
        <image href="../Coding Wallpaer.jpeg" x="0" y="-80" width="540" height="700" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </g>
  </g>
</svg>
