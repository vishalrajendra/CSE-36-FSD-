<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <linearGradient id="lanyardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <clipPath id="avatarClip">
      <circle cx="175" cy="230" r="65"/>
    </clipPath>
  </defs>

  <style>
    /* Damped Pendulum Swing Physics */
    @keyframes pendulumSwing {
      0% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
      100% { transform: rotate(-14deg); }
    }
    @keyframes shineMove {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(400px); }
    }
    .swing-assembly {
      transform-origin: 250px 0px;
      animation: pendulumSwing 4.5s ease-in-out infinite;
    }
    .shine-sweep {
      animation: shineMove 3s ease-in-out infinite;
    }
  </style>

  <g class="swing-assembly">
    <path d="M225,0 L225,90 L275,90 L275,0 Z" fill="#ff007f"/>
    <text x="250" y="55" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">DEV ID</text>

    <rect x="235" y="90" width="30" height="15" rx="3" fill="#94a3b8"/>
    <circle cx="250" cy="115" r="14" fill="none" stroke="#64748b" stroke-width="4"/>

    <g transform="translate(75, 125)">
      <rect width="350" height="520" rx="20" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
      
      <rect x="145" y="15" width="60" height="8" rx="4" fill="#030712"/>

      <circle cx="175" cy="145" r="70" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
      
      <g transform="translate(0, -85)">
        <image href="../Coding Wallpaer.jpeg" x="90" y="145" width="170" height="170" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
      </g>

      <text x="175" y="255" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
        Vishal Pratap Singh
      </text>
      
      <rect x="110" y="272" width="130" height="24" rx="12" fill="#ff007f" opacity="0.15"/>
      <text x="175" y="288" font-family="monospace" font-size="12" font-weight="bold" fill="#ff007f" text-anchor="middle">
        STUDENT DEV
      </text>

      <text x="175" y="325" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">
        @vishalrajendra
      </text>

      <line x1="40" y1="355" x2="310" y2="355" stroke="#1e293b" stroke-width="1.5"/>

      <text x="50" y="390" font-family="sans-serif" font-size="11" fill="#64748b">STATUS</text>
      <text x="50" y="410" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00e5ff">ON CODE MODE</text>

      <text x="220" y="390" font-family="sans-serif" font-size="11" fill="#64748b">CORE</text>
      <text x="220" y="410" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981">FULL-STACK</text>

      <g transform="translate(45, 445)">
        <rect width="4" height="40" fill="#cbd5e1"/>
        <rect x="7" width="2" height="40" fill="#cbd5e1"/>
        <rect x="12" width="6" height="40" fill="#cbd5e1"/>
        <rect x="22" width="3" height="40" fill="#cbd5e1"/>
        <rect x="30" width="8" height="40" fill="#cbd5e1"/>
        <rect x="42" width="2" height="40" fill="#cbd5e1"/>
        <rect x="48" width="5" height="40" fill="#cbd5e1"/>
        <rect x="57" width="9" height="40" fill="#cbd5e1"/>
        <rect x="70" width="3" height="40" fill="#cbd5e1"/>
        <rect x="78" width="6" height="40" fill="#cbd5e1"/>
        <rect x="88" width="2" height="40" fill="#cbd5e1"/>
        <rect x="94" width="7" height="40" fill="#cbd5e1"/>
        <rect x="105" width="4" height="40" fill="#cbd5e1"/>
        <rect x="115" width="2" height="40" fill="#cbd5e1"/>
        <rect x="122" width="8" height="40" fill="#cbd5e1"/>
        <rect x="135" width="3" height="40" fill="#cbd5e1"/>
        <rect x="144" width="5" height="40" fill="#cbd5e1"/>
        <rect x="154" width="7" height="40" fill="#cbd5e1"/>
        <rect x="166" width="2" height="40" fill="#cbd5e1"/>
        <rect x="172" width="6" height="40" fill="#cbd5e1"/>
        <rect x="183" width="4" height="40" fill="#cbd5e1"/>
        <rect x="193" width="8" height="40" fill="#cbd5e1"/>
        <rect x="205" width="3" height="40" fill="#cbd5e1"/>
        <rect x="214" width="5" height="40" fill="#cbd5e1"/>
        <rect x="225" width="6" height="40" fill="#cbd5e1"/>
        <rect x="236" width="3" height="40" fill="#cbd5e1"/>
        <rect x="245" width="8" height="40" fill="#cbd5e1"/>
        <rect x="256" width="4" height="40" fill="#cbd5e1"/>
      </g>

      <rect class="shine-sweep" width="260" height="520" fill="url(#lanyardShine)" pointer-events="none"/>
    </g>
  </g>
</svg>
