<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="bannerClip">
      <rect width="1280" height="740" rx="24" ry="24"/>
    </clipPath>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.35); opacity: 0.45; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-120px) rotate(180deg); opacity: 0; }
    }
    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; filter: drop-shadow(0 0 10px #ff2a85); }
      20%, 24%, 55% { opacity: 0.3; filter: none; }
    }
    @keyframes sweepDown {
      0% { transform: translateY(-740px); }
      100% { transform: translateY(740px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes cardFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bg-orb { animation: pulseOrb 6s ease-in-out infinite alternate; }
    .particle { animation: floatParticle 4s infinite linear; }
    .neon-text { animation: neonFlicker 4s infinite; font-family: 'Courier New', monospace; font-weight: 900; }
    .scanner-line { animation: sweepDown 3.5s linear infinite; }
    .cursor { animation: blink 0.9s infinite; }
    .code-card { animation: cardFade 1.2s ease-out forwards; }
    .pill { transition: all 0.3s ease; }
    .pill:hover { fill: #8a2be2 !important; }
  </style>

  <g clip-path="url(#bannerClip)">
    <rect width="1280" height="740" fill="url(#bgGrad)"/>
    <rect width="1280" height="740" fill="none" stroke="#1f293d" stroke-width="2" rx="24"/>

    <circle class="bg-orb" cx="200" cy="180" r="140" fill="#8a2be2" filter="url(#neonGlow)"/>
    <circle class="bg-orb" cx="1080" cy="400" r="160" fill="#ff2a85" filter="url(#neonGlow)"/>
    <circle class="bg-orb" cx="640" cy="650" r="120" fill="#00e5ff" filter="url(#neonGlow)"/>

    <circle class="particle" cx="150" cy="500" r="2.5" fill="#00e5ff" style="animation-delay: 0s;"/>
    <circle class="particle" cx="300" cy="620" r="3" fill="#ff2a85" style="animation-delay: 1.2s;"/>
    <circle class="particle" cx="550" cy="480" r="2" fill="#8a2be2" style="animation-delay: 2.1s;"/>
    <circle class="particle" cx="820" cy="600" r="3.5" fill="#00e5ff" style="animation-delay: 0.8s;"/>
    <circle class="particle" cx="1100" cy="520" r="2.5" fill="#ff2a85" style="animation-delay: 1.7s;"/>

    <g transform="translate(60, 50)">
      <rect width="450" height="34" rx="8" fill="#121829" stroke="#1e293b"/>
      <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
      <circle cx="36" cy="17" r="4.5" fill="#f59e0b"/>
      <circle cx="52" cy="17" r="4.5" fill="#10b981"/>
      <text x="70" y="22" font-family="'Fira Code', 'Courier New', monospace" font-size="13" fill="#00e5ff">
        user@dev:~$ cat README.md
      </text>
      <rect class="cursor" x="256" y="10" width="8" height="15" fill="#00e5ff"/>
    </g>

    <g transform="translate(60, 150)">
      <text font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#nameGrad)" letter-spacing="1.5">
        Vishal Pratap Singh
      </text>
      <text y="38" font-family="'Fira Code', monospace" font-size="18" fill="#94a3b8">
        &gt; Student &amp; Software Developer
      </text>
    </g>

    <g transform="translate(60, 230)">
      <rect width="210" height="36" rx="18" fill="#1e1b4b" stroke="#ff2a85" stroke-width="1.5"/>
      <text x="105" y="23" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#ff2a85" text-anchor="middle">
        ⚡ "On Code Mode"
      </text>
    </g>

    <g transform="translate(60, 290)">
      <text font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#64748b" letter-spacing="1">SKILLS &amp; TECHNOLOGIES</text>
      
      <g transform="translate(0, 15)">
        <rect class="pill" width="80" height="28" rx="6" fill="#1e293b"/>
        <text x="40" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Python</text>

        <rect class="pill" x="90" width="65" height="28" rx="6" fill="#1e293b"/>
        <text x="122" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Java</text>

        <rect class="pill" x="165" width="65" height="28" rx="6" fill="#1e293b"/>
        <text x="197" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">C++</text>

        <rect class="pill" x="240" width="95" height="28" rx="6" fill="#1e293b"/>
        <text x="287" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">JavaScript</text>

        <rect class="pill" x="345" width="75" height="28" rx="6" fill="#1e293b"/>
        <text x="382" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">React</text>

        <rect class="pill" x="430" width="85" height="28" rx="6" fill="#1e293b"/>
        <text x="472" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Angular</text>
      </g>

      <g transform="translate(0, 52)">
        <rect class="pill" width="85" height="28" rx="6" fill="#1e293b"/>
        <text x="42" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">NodeJS</text>

        <rect class="pill" x="95" width="80" height="28" rx="6" fill="#1e293b"/>
        <text x="135" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Docker</text>

        <rect class="pill" x="185" width="105" height="28" rx="6" fill="#1e293b"/>
        <text x="237" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Kubernetes</text>

        <rect class="pill" x="300" width="85" height="28" rx="6" fill="#1e293b"/>
        <text x="342" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">VS Code</text>

        <rect class="pill" x="395" width="120" height="28" rx="6" fill="#1e293b"/>
        <text x="455" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">Communication</text>
      </g>
    </g>

    <g class="code-card" transform="translate(60, 410)">
      <rect width="520" height="260" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
      <rect width="520" height="32" rx="14" fill="#161b22"/>
      <circle cx="18" cy="16" r="4" fill="#ff5f56"/>
      <circle cx="32" cy="16" r="4" fill="#ffbd2e"/>
      <circle cx="46" cy="16" r="4" fill="#27c93f"/>
      <text x="260" y="20" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">buildDreams.jsx</text>

      <text x="20" y="65" font-family="'Fira Code', monospace" font-size="13" fill="#ff7b72">const <tspan fill="#79c0ff">buildDreams</tspan> = <tspan fill="#d2a8ff">async</tspan> () =&gt; {</text>
      <text x="40" y="95" font-family="'Fira Code', monospace" font-size="13" fill="#ff7b72">const <tspan fill="#e2e8f0">coder</tspan> = <tspan fill="#79c0ff">new</tspan> <tspan fill="#ffa657">StudentDeveloper</tspan>(<tspan fill="#a5d6ff">"Vishal"</tspan>);</text>
      <text x="40" y="125" font-family="'Fira Code', monospace" font-size="13" fill="#d2a8ff">while <tspan fill="#e2e8f0">(coder.isAwake()) {</tspan></text>
      <text x="60" y="155" font-family="'Fira Code', monospace" font-size="13" fill="#79c0ff">await <tspan fill="#e2e8f0">coder.</tspan><tspan fill="#d2a8ff">solveProblems</tspan>(<tspan fill="#a5d6ff">"LeetCode"</tspan>);</text>
      <text x="60" y="185" font-family="'Fira Code', monospace" font-size="13" fill="#e2e8f0">coder.<tspan fill="#d2a8ff">deployAwesomeProjects</tspan>();</text>
      <text x="40" y="215" font-family="'Fira Code', monospace" font-size="13" fill="#e2e8f0">}</text>
      <text x="20" y="245" font-family="'Fira Code', monospace" font-size="13" fill="#ff7b72">};</text>
    </g>

    <g transform="translate(680, 60)">
      <rect width="540" height="48" rx="10" fill="#110e1b" stroke="#ff2a85" stroke-width="1.5" filter="url(#neonGlow)"/>
      <text class="neon-text" x="270" y="31" font-size="16" fill="#ff2a85" text-anchor="middle">
        ⚡ KEEP CODING • KEEP GROWING ⚡
      </text>
    </g>

    <g transform="translate(680, 130)">
      <rect width="540" height="540" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <clipPath id="avatarFrameClip">
        <rect width="540" height="540" rx="16"/>
      </clipPath>
      <g clip-path="url(#avatarFrameClip)">
        <image href="../Coding Wallpaer.jpeg" x="0" y="-80" width="540" height="700" preserveAspectRatio="xMidYMid slice"/>
        <rect width="540" height="8" fill="#00e5ff" opacity="0.75" filter="url(#neonGlow)">
          <animate attributeName="y" values="0;540;0" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect class="scanner-line" width="1280" height="100" fill="url(#scanGrad)" pointer-events="none"/>
  </g>
</svg>
